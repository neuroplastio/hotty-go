# CI: make check, and the conformance vectors being the spec's.
#
# GitHub's hosted runners: the repository is public. Never a self-hosted
# runner here, since a pull request from anyone would run its code on it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # Go's module and build caches, keyed by every module's go.sum.
      - uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('mise.toml', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: make check

  vectors:
    name: the conformance vectors are the spec's
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: neuroplastio/hotty
          path: .hotty
      - uses: jdx/mise-action@v4
      - name: testdata/conformance/vectors.json is neuroplastio/hotty's
        run: |
          if ! cmp -s .hotty/conformance/vectors.json testdata/conformance/vectors.json; then
            echo "testdata/conformance/vectors.json differs from neuroplastio/hotty's: run make vectors" >&2
            exit 1
          fi
      - name: the wire decodes them
        env:
          HOTTY_DIR: ${{ github.workspace }}/.hotty
        run: mise x -- go test -run 'TestVectorsAreCurrent|TestWireVectors' -v .
